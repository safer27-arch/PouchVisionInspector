plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pouchvision.inspector'
    compileSdk 35

    defaultConfig {
        applicationId "com.pouchvision.inspector"
        minSdk 26
        targetSdk 35

        // GitHub Actions 실행 번호를 versionCode로 사용합니다.
        // 로컬 빌드 시에는 1을 사용합니다.
        def ciBuildNumber = System.getenv("BUILD_NUMBER")
        versionCode ciBuildNumber != null ? ciBuildNumber.toInteger() : 1
        versionName "1.0.${ciBuildNumber != null ? ciBuildNumber : 'local'}"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // Telegram 네트워크 장애 자동 재전송
    implementation 'androidx.work:work-runtime:2.11.2'
}
