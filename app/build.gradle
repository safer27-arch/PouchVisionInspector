plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pouchvision.inspector'
    compileSdk 35

    defaultConfig {
        applicationId "com.pouchvision.inspector"
        minSdk 26
        targetSdk 35

        // GitHub Actions 실행 번호가 올라갈 때마다 자동 증가합니다.
        def ciBuildNumber = System.getenv("BUILD_NUMBER")
        // 기존 APK보다 확실히 높은 버전이 되도록 10000을 더합니다.
        // 예: GitHub Actions #305 -> versionCode 10305
        versionCode ciBuildNumber != null ? (10000 + ciBuildNumber.toInteger()) : 10001
        versionName "1.1.${ciBuildNumber != null ? ciBuildNumber : 'local'}"
    }

    /*
     * APK 업데이트 설치를 위해 서명키를 명시적으로 고정합니다.
     * GitHub Actions가 매번 같은 DEBUG_KEYSTORE_BASE64 Secret을
     * app/pouchvision.keystore로 복원합니다.
     */
    signingConfigs {
        stable {
            def keystorePath = System.getenv("POUCH_KEYSTORE_PATH")
            if (keystorePath != null && !keystorePath.isBlank()) {
                storeFile file(keystorePath)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }

        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // Telegram 네트워크 장애 자동 재전송
    implementation 'androidx.work:work-runtime:2.11.2'
}
