name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore stable APK signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "ERROR: DEBUG_KEYSTORE_BASE64 GitHub Secret is missing."
            exit 1
          fi

          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/pouchvision.keystore"
          chmod 600 "$GITHUB_WORKSPACE/app/pouchvision.keystore"

          echo "Stable signing certificate:"
          keytool -list -v             -keystore "$GITHUB_WORKSPACE/app/pouchvision.keystore"             -storepass android             -alias androiddebugkey             | grep "SHA256:"

      - name: Build signed Release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          POUCH_KEYSTORE_PATH: ${{ github.workspace }}/app/pouchvision.keystore
        run: gradle assembleRelease

      - name: Verify APK signature and version
        run: |
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)

          echo "=== APK CERTIFICATE ===" | tee "$GITHUB_WORKSPACE/app/build/outputs/apk/release/build-info.txt"
          "$APKSIGNER" verify --print-certs "$APK" | tee -a "$GITHUB_WORKSPACE/app/build/outputs/apk/release/build-info.txt"

          echo "" | tee -a "$GITHUB_WORKSPACE/app/build/outputs/apk/release/build-info.txt"
          echo "=== APK VERSION ===" | tee -a "$GITHUB_WORKSPACE/app/build/outputs/apk/release/build-info.txt"
          "$AAPT" dump badging "$APK" | grep "^package:" | tee -a "$GITHUB_WORKSPACE/app/build/outputs/apk/release/build-info.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PouchVisionInspector-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/build-info.txt
